plugins {
    id 'com.android.application'
}

android {
    namespace 'th.pipeline.harvest'
    compileSdk 34

    defaultConfig {
        applicationId "th.pipeline.harvest"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    // เซ็นด้วยกุญแจ debug ไปก่อน (แอปในวงส่วนตัว ไม่ได้ขึ้นสโตร์)
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Shizuku — ให้แอปเรียก shell/สั่งกดหน้าจอด้วยสิทธิ์ระดับ adb โดยไม่ต้องต่อคอม
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // ML Kit อ่านตัวอักษรจากภาพ (ใช้หา EXTRA COMM ซึ่งเป็นภาษาอังกฤษ)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // ML Kit พ่วง kotlin-stdlib-jdk7/jdk8 1.6.21 มา ชนกับ kotlin-stdlib 1.8.22 ของ androidx.core
    // (build ล้ม "Duplicate class kotlin.*") — BOM บังคับให้ทุกตัวใช้ 1.8.22 ซึ่ง jdk7/jdk8 เป็นแค่ตัวเปล่า
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
