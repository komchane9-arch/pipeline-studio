plugins {
    id 'com.android.application'
}

android {
    namespace 'th.pipeline.harvest'
    compileSdk 34

    defaultConfig {
        applicationId "th.pipeline.harvest"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    // เซ็นด้วยกุญแจ debug ไปก่อน (แอปในวงส่วนตัว ไม่ได้ขึ้นสโตร์)
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // Shizuku — ให้แอปเรียก system service ด้วยสิทธิ์ระดับ shell (อ่านคลิปบอร์ดเบื้องหลังได้)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
