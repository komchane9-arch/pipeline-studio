<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Poster</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1c1f24; --muted: #69707d;
    --line: #dde1e6; --accent: #1f6feb; --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1e24; --text: #e6e8eb; --muted: #9aa2ad;
            --line: #2c323a; --accent: #4c8dff; --ok: #3fb950; --bad: #f85149; --warn: #d29922; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Noto Sans Thai", "Leelawadee UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
  input[type=text], textarea, select, input[type=number] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1 1 auto; }
  button { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); font: inherit; cursor: pointer; flex: 0 0 auto; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 13px; font-weight: 600; }
  .on { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .off { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .msg { margin-top: 8px; font-size: 14px; }
  .msg.err { color: var(--bad); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        max-height: 320px; overflow: auto; font-size: 12.5px; white-space: pre-wrap; margin: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--muted); }
  .hidden { display: none; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Group Poster <span class="hint">โพสต์ลงกลุ่ม Facebook ผ่านมือถือ</span></h1>

  <section class="card" id="licenseCard">
    <h2>License <span id="licBadge" class="badge off">กำลังตรวจ…</span></h2>
    <div id="licInfo"></div>
    <div id="activateBox" class="hidden">
      <label for="code">รหัสสินค้า <span class="hint">เช่น GP-ABCD-EFGH-JKMN-PQRS</span></label>
      <div class="row">
        <input type="text" id="code" autocomplete="off" spellcheck="false">
        <button class="primary" id="activateBtn">เปิดใช้งาน</button>
      </div>
    </div>
    <div class="row" id="licActions" style="margin-top:10px">
      <button id="refreshBtn">ตรวจกับ server อีกครั้ง</button>
      <button class="danger hidden" id="deactivateBtn">ปลดเครื่องนี้ (เพื่อย้ายไปเครื่องอื่น)</button>
    </div>
    <div class="msg" id="licMsg"></div>
  </section>

  <section class="card" id="postCard">
    <h2>สร้างงานโพสต์</h2>
    <label for="device">มือถือ <span class="hint">ต่อสาย USB และเปิด USB debugging ไว้</span></label>
    <div class="row">
      <select id="device"></select>
      <button id="reloadDevices">โหลดใหม่</button>
    </div>

    <label for="images">รูป <span class="hint">1-3 รูป (jpg, png, webp)</span></label>
    <input type="file" id="images" accept=".jpg,.jpeg,.png,.webp" multiple>

    <label for="caption">ข้อความโพสต์</label>
    <textarea id="caption" placeholder="ใครห้องร้อนต้องดู! พัดลมตัวนี้…"></textarea>

    <label for="comment">คอมเมนต์ใต้โพสต์ <span class="hint">ไม่บังคับ เช่น ลิงก์ Shopee — ใส่ในคอมเมนต์ช่วยให้กลุ่มไม่ลบโพสต์</span></label>
    <textarea id="comment" style="min-height:60px" placeholder="พิกัด 👉 https://s.shopee.co.th/..."></textarea>

    <label for="groups">กลุ่ม <span class="hint">เลข ID กลุ่ม หรือลิงก์ facebook.com/groups/เลข · บรรทัดละกลุ่ม</span></label>
    <textarea id="groups" placeholder="123456789012345&#10;https://www.facebook.com/groups/987654321098765"></textarea>
    <div class="hint" id="groupCount"></div>

    <label>ระยะห่างระหว่างกลุ่ม (วินาที) <span class="hint">ต่ำสุด 15 วินาที เพื่อไม่ให้โดนมองเป็นสแปม</span></label>
    <div class="row">
      <input type="number" id="gapMin" value="20" min="15" max="600">
      <span style="flex:0">ถึง</span>
      <input type="number" id="gapMax" value="40" min="15" max="600">
    </div>

    <label><input type="checkbox" id="dryRun" checked> ทดลองก่อน (ทำทุกขั้นแต่ไม่กดโพสต์จริง)</label>

    <div class="row" style="margin-top:14px">
      <button class="primary" id="startBtn">เริ่มโพสต์</button>
      <button class="danger hidden" id="stopBtn">หยุด</button>
    </div>
    <div class="msg" id="postMsg"></div>
  </section>

  <section class="card hidden" id="jobCard">
    <h2>ความคืบหน้า <span id="jobState" class="badge"></span></h2>
    <table><thead><tr><th>กลุ่ม</th><th>ผล</th></tr></thead><tbody id="resultRows"></tbody></table>
    <label>บันทึก</label>
    <pre id="log"></pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let license = null, job = null, logTotal = 0, poll = null;

async function api(path, options = {}) {
  const res = await fetch(path, options);
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.detail || `ผิดพลาด (${res.status})`);
  return data;
}

function showMsg(el, text, isError) {
  el.textContent = text || "";
  el.className = "msg" + (isError ? " err" : "");
}

function renderLicense(s) {
  license = s;
  $("licBadge").textContent = s.active ? "ใช้งานได้" : "ยังใช้ไม่ได้";
  $("licBadge").className = "badge " + (s.active ? "on" : "off");
  const lic = s.license;
  $("activateBox").classList.toggle("hidden", !!(lic && s.active));
  $("deactivateBtn").classList.toggle("hidden", !lic);
  if (lic) {
    const exp = lic.expires ? lic.expires.slice(0, 10) : "ไม่หมดอายุ";
    $("licInfo").innerHTML = `<dl>
      <dt>แพ็กเกจ</dt><dd>${lic.sku}</dd>
      <dt>หมดอายุ</dt><dd>${exp}</dd>
      <dt>กลุ่มต่อรอบ</dt><dd>ไม่เกิน ${lic.max_groups} กลุ่ม</dd>
      <dt>สถานะ</dt><dd>${escapeHtml(s.message)}</dd></dl>`;
  } else {
    $("licInfo").innerHTML = `<div class="hint">${escapeHtml(s.message)}</div>`;
  }
  $("postCard").style.opacity = s.active ? 1 : .55;
  $("startBtn").disabled = !s.active || (job && job.state === "running");
}

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

async function loadLicense() {
  try { renderLicense(await api("/api/license")); }
  catch (e) { showMsg($("licMsg"), e.message, true); }
}

$("activateBtn").onclick = async () => {
  showMsg($("licMsg"), "กำลังตรวจรหัส…");
  try {
    renderLicense(await api("/api/license/activate", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({code: $("code").value}),
    }));
    showMsg($("licMsg"), "เปิดใช้งานสำเร็จ");
  } catch (e) { showMsg($("licMsg"), e.message, true); }
};

$("refreshBtn").onclick = async () => {
  showMsg($("licMsg"), "กำลังตรวจ…");
  try { renderLicense(await api("/api/license/refresh", {method: "POST"})); showMsg($("licMsg"), ""); }
  catch (e) { showMsg($("licMsg"), e.message, true); }
};

$("deactivateBtn").onclick = async () => {
  if (!confirm("ปลดเครื่องนี้ออกจากรหัส? ต้องใส่รหัสใหม่ถ้าจะใช้เครื่องนี้อีก")) return;
  try { renderLicense(await api("/api/license/deactivate", {method: "POST"})); showMsg($("licMsg"), "ปลดเครื่องแล้ว"); }
  catch (e) { showMsg($("licMsg"), e.message, true); }
};

async function loadDevices() {
  const select = $("device");
  select.innerHTML = "<option value=''>กำลังหา…</option>";
  try {
    const data = await api("/api/devices");
    const ready = data.devices.filter((d) => d.state === "device");
    select.innerHTML = "";
    if (!data.devices.length) select.innerHTML = "<option value=''>ไม่พบมือถือ — ต่อสาย USB แล้วกดโหลดใหม่</option>";
    for (const d of data.devices) {
      const opt = document.createElement("option");
      opt.value = d.state === "device" ? d.serial : "";
      const note = d.state === "unauthorized" ? " (กดอนุญาตบนมือถือก่อน)" : d.state !== "device" ? ` (${d.state})` : "";
      opt.textContent = `${d.model || "Android"} · ${d.serial}${note}`;
      select.appendChild(opt);
    }
    if (ready.length) select.value = ready[0].serial;
  } catch (e) { select.innerHTML = `<option value=''>${escapeHtml(e.message)}</option>`; }
}
$("reloadDevices").onclick = loadDevices;

$("groups").oninput = () => {
  const n = $("groups").value.split(/[\s,]+/).filter(Boolean).length;
  const max = license && license.license ? license.license.max_groups : null;
  $("groupCount").textContent = n ? `${n} กลุ่ม` + (max ? ` (แพ็กเกจนี้ได้ไม่เกิน ${max})` : "") : "";
};

$("startBtn").onclick = async () => {
  const form = new FormData();
  form.append("serial", $("device").value);
  form.append("caption", $("caption").value);
  form.append("comment", $("comment").value);
  form.append("groups", $("groups").value);
  form.append("gap_min", $("gapMin").value);
  form.append("gap_max", $("gapMax").value);
  form.append("dry_run", $("dryRun").checked ? "true" : "false");
  for (const file of $("images").files) form.append("images", file);
  if (!$("dryRun").checked && !confirm("โพสต์จริงลงทุกกลุ่มที่ใส่ไว้?")) return;
  showMsg($("postMsg"), "กำลังเริ่ม…");
  try {
    job = await api("/api/jobs", {method: "POST", body: form});
    logTotal = 0; $("log").textContent = "";
    showMsg($("postMsg"), "");
    renderJob(job); startPolling();
  } catch (e) { showMsg($("postMsg"), e.message, true); }
};

$("stopBtn").onclick = async () => {
  if (!job) return;
  try { await api(`/api/jobs/${job.id}/stop`, {method: "POST"}); } catch (e) { showMsg($("postMsg"), e.message, true); }
};

const STATES = {running: "กำลังทำ", done: "เสร็จแล้ว", stopped: "หยุดแล้ว", failed: "ล้มเหลว"};

function resultText(r, running) {
  if (r.error) return `<span class="bad">✗ ${escapeHtml(r.error)}</span>`;
  if (r.dry_run) return `<span class="ok">✓ ทดลองผ่าน (ไม่ได้กดโพสต์)</span>`;
  if (r.posted) {
    const extra = [r.commented ? "คอมเมนต์แล้ว" : "", r.liked ? "ถูกใจแล้ว" : ""].filter(Boolean).join(" · ");
    return `<span class="ok">✓ โพสต์แล้ว</span>${extra ? " · " + extra : ""}`;
  }
  return `<span class="wait">${running ? "รอคิว" : "ยังไม่ได้ทำ"}</span>`;
}

function renderJob(j) {
  $("jobCard").classList.remove("hidden");
  $("jobState").textContent = (STATES[j.state] || j.state) + (j.dry_run ? " · ทดลอง" : "");
  $("jobState").className = "badge " + (j.state === "failed" ? "off" : "on");
  $("resultRows").innerHTML = j.results.map((r) =>
    `<tr><td>${escapeHtml(r.group_id)}</td><td>${resultText(r, j.state === "running")}</td></tr>`).join("");
  if (j.logs && j.logs.length) {
    $("log").textContent += j.logs.join("\n") + "\n";
    $("log").scrollTop = $("log").scrollHeight;
  }
  logTotal = j.log_total;
  const running = j.state === "running";
  $("stopBtn").classList.toggle("hidden", !running);
  $("startBtn").disabled = running || !(license && license.active);
}

function startPolling() {
  clearInterval(poll);
  poll = setInterval(async () => {
    try {
      const data = await api(`/api/jobs/current?since=${logTotal}`);
      if (!data.job) return;
      job = data.job; renderJob(job);
      if (job.state !== "running") clearInterval(poll);
    } catch (_) {}
  }, 1500);
}

(async () => {
  await loadLicense();
  loadDevices();
  const data = await api("/api/jobs/current").catch(() => ({}));
  if (data.job) { job = data.job; logTotal = 0; $("log").textContent = ""; renderJob(job); if (job.state === "running") startPolling(); }
  setInterval(loadLicense, 60000);
})();
</script>
</body>
</html>
